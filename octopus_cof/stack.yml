version: '3.8'

services:
  octopus-voucher:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - OCTOPUS_ACCOUNT_NUMBER=${OCTOPUS_ACCOUNT_NUMBER}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SESSION_FILE=${SESSION_FILE:-/app/logs/session.json}
      - POLL_INTERVAL=${POLL_INTERVAL:-60}
      - WINDOW_START_HOUR=${WINDOW_START_HOUR:-4}
      - WINDOW_END_HOUR=${WINDOW_END_HOUR:-9}
      - OFFER_TARGET=${OFFER_TARGET:-}
      - LOG_DIR=/app/logs
    volumes:
      - octopus_logs:/app/logs
    shm_size: '256mb'
    mem_limit: 512m
    memswap_limit: 512m
    security_opt:
      - seccomp:unconfined
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  octopus_logs:
    driver: local
