<div id="dash-weight-quick">
  <div class="stat">{{ latest_body.weight_kg or "—" }} kg</div>
  <form class="inline" style="margin-top:.4rem;margin-bottom:0;"
        hx-post="/dashboard/weight-quick" hx-target="#dash-weight-quick" hx-swap="outerHTML">
    <input type="number" step="0.1" name="weight_kg" placeholder="log today's weight" required style="max-width:140px;">
    <button type="submit" class="secondary">Log</button>
  </form>
</div>
