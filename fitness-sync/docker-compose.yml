# ─── fitness-sync — Garmin+Hevy sync + SQLite + FastAPI (API + web UI) ────────────
# Single self-hosted service, one process (uvicorn; the sync loop runs as a background
# thread inside it — see app/sync/loop.py). Generic BIND-MOUNT deploy for a host with a
# real filesystem to share (podman/docker compose). If deploying to a host with no
# shareable host FS (e.g. an LXC/Portainer target), use docker-stack.yml's named-volume
# variant instead.
#
#   single host:   docker compose up -d        (or `podman compose up -d`)
#   swarm/stack:   podman build -t fitness-sync:latest .
#                  then  docker stack deploy -c docker-compose.yml fitness-sync
#
# BEFORE `up`:  cp .env.example .env   (fill AUTH_USER/AUTH_PASSWORD; Garmin auth is
#               the tokenstore, not env creds — see README)
# ────────────────────────────────────────────────────────────────────────────────
services:
  fitness-sync:
    build: .
    image: fitness-sync:latest
    container_name: fitness-sync
    restart: unless-stopped
    # Opt out of Watchtower if it's running on this host — this image is local-only
    # (no registry to pull from); Watchtower's update-check kills the container trying
    # to check anyway. See docker-stack.yml for the full incident writeup.
    labels:
      - com.centurylinklabs.watchtower.enable=false

    env_file:
      - .env

    environment:
      - GARMIN_TOKENSTORE=/app/garmin/tokens.txt
      - SYNC_INTERVAL_HOURS=${SYNC_INTERVAL_HOURS:-6}
      - PORT=8000

    ports:
      - "${HOST_PORT:-8000}:8000"

    # One bind mount: the whole tree, so host and container resolve the same
    # relative paths. data/fitness.db lives here too, alongside the CSVs' old spot.
    volumes:
      - ./:/app

    # ── uncomment for `docker stack deploy` (swarm) ──
    # deploy:
    #   replicas: 1
    #   restart_policy:
    #     condition: unless-stopped
