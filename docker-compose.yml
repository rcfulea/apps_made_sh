version: "3"
services:
  garden-planner:
    image: ghcr.io/rcfulea/apps_made_sh:latest
    container_name: garden-planner
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./garden-data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

# Optional: Watchtower setup if you don't have it globally
#  watchtower:
